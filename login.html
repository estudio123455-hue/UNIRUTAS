<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRutas — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4l3 3"/>
      </svg>
    </div>
    <span class="auth-logo-text">UniRutas</span>
  </div>

  <!-- Card -->
  <div class="auth-card">
    <h2>Bienvenido de nuevo</h2>
    <p>Inicia sesión para continuar</p>

    <form id="login-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          class="form-input"
          type="email"
          id="email"
          placeholder="tu@correo.com"
          autocomplete="email"
          required
        >
        <span class="form-error" id="email-error">Ingresa un correo válido</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position:relative">
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            style="padding-right: 48px"
            required
          >
          <button type="button" id="toggle-pw" class="btn-icon" aria-label="Mostrar contraseña"
            style="position:absolute; right:4px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:var(--gris-400)">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="form-error" id="password-error">Ingresa tu contraseña</span>
      </div>

      <div style="text-align:right; margin-bottom:20px">
        <a href="#" id="forgot-pw" style="font-size:0.875rem">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">
        <span id="login-text">Iniciar sesión</span>
        <span class="spinner" id="login-spinner"></span>
      </button>

    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
    </div>
  </div>

</div>

<!-- Modal recuperar contraseña -->
<div id="modal-reset" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; align-items:center; justify-content:center; padding:16px">
  <div class="card" style="width:100%; max-width:380px; border-radius:var(--radio-xl)">
    <h3 style="margin-bottom:8px">Recuperar contraseña</h3>
    <p style="margin-bottom:20px">Te enviaremos un enlace a tu correo</p>
    <div class="form-group">
      <input class="form-input" type="email" id="reset-email" placeholder="tu@correo.com">
    </div>
    <div style="display:flex; gap:10px">
      <button class="btn btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-send">Enviar enlace</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from './js/firebase.js';
  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { showToast } from './js/toast.js';

  // Si ya hay sesión, redirigir al mapa
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'index.html';
  });

  // Mostrar/ocultar contraseña
  const togglePw = document.getElementById('toggle-pw');
  const pwInput  = document.getElementById('password');
  togglePw.addEventListener('click', () => {
    const esPassword = pwInput.type === 'password';
    pwInput.type = esPassword ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = esPassword
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });

  // Validación
  function validarEmail(val) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); }

  function mostrarError(id, visible) {
    document.getElementById(id).classList.toggle('visible', visible);
    document.getElementById(id.replace('-error',''))?.classList.toggle('error', visible);
  }

  // Submit login
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valido = true;
    if (!validarEmail(email)) { mostrarError('email-error', true); valido = false; }
    else mostrarError('email-error', false);
    if (!password) { mostrarError('password-error', true); valido = false; }
    else mostrarError('password-error', false);
    if (!valido) return;

    const btn = document.getElementById('login-btn');
    const spinner = document.getElementById('login-spinner');
    const texto = document.getElementById('login-text');
    btn.disabled = true;
    spinner.classList.add('visible');
    texto.style.display = 'none';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'index.html';
    } catch (err) {
      btn.disabled = false;
      spinner.classList.remove('visible');
      texto.style.display = '';
      const mensajes = {
        'auth/user-not-found':     'Correo o contraseña incorrectos',
        'auth/wrong-password':     'Correo o contraseña incorrectos',
        'auth/invalid-email':      'Correo inválido',
        'auth/too-many-requests':  'Demasiados intentos. Intenta más tarde',
        'auth/invalid-credential': 'Correo o contraseña incorrectos'
      };
      showToast(mensajes[err.code] || 'Error al iniciar sesión', 'danger');
    }
  });

  // Modal recuperar contraseña
  const modal = document.getElementById('modal-reset');
  document.getElementById('forgot-pw').addEventListener('click', (e) => {
    e.preventDefault();
    modal.style.display = 'flex';
  });
  document.getElementById('modal-cancel').addEventListener('click', () => {
    modal.style.display = 'none';
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.style.display = 'none';
  });
  document.getElementById('modal-send').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    if (!validarEmail(email)) { showToast('Ingresa un correo válido', 'warning'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      showToast('Enlace enviado, revisa tu correo', 'success');
      modal.style.display = 'none';
    } catch {
      showToast('Si el correo está registrado, recibirás un enlace pronto', 'success');
    }
  });
</script>

</body>
</html>
