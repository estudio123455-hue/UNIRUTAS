<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRutas — Mi perfil</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--gris-50);
      padding-bottom: 80px;
    }

    /* Header */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--blanco);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gris-200);
    }
    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gris-900);
    }
    .btn-logout {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gris-100);
      color: var(--gris-600);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-logout:hover {
      background: var(--rojo-light);
      color: var(--rojo);
    }

    /* Avatar y datos */
    .profile-section {
      background: var(--blanco);
      padding: 24px 20px;
      border-bottom: 1px solid var(--gris-200);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--verde);
      color: var(--blanco);
      font-size: 1.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .profile-info {
      flex: 1;
    }
    .profile-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 4px;
    }
    .profile-email {
      font-size: 0.875rem;
      color: var(--gris-500);
      margin-bottom: 8px;
    }
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-vehiculo {
      background: var(--verde-light);
      color: var(--verde-dark);
    }
    .badge-verified {
      background: #dcfce7;
      color: #166534;
    }
    .badge-unverified {
      background: var(--gris-200);
      color: var(--gris-600);
    }

    /* Editar perfil */
    .edit-section {
      background: var(--blanco);
      padding: 20px;
      border-bottom: 1px solid var(--gris-200);
    }
    .edit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .edit-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gris-900);
    }
    .btn-edit {
      padding: 8px 16px;
      border-radius: var(--radio-md);
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      color: var(--gris-700);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-edit:hover {
      border-color: var(--verde);
      color: var(--verde);
    }

    .edit-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .edit-form.open {
      display: flex;
    }

    .form-group {
      margin-bottom: 0;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      font-size: 0.95rem;
      background: var(--blanco);
      color: var(--gris-800);
      transition: border-color 0.15s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--verde);
    }

    /* Vehículo selector */
    .vehiculo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .vehiculo-option {
      position: relative;
    }
    .vehiculo-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .vehiculo-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      background: var(--blanco);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--gris-600);
    }
    .vehiculo-option input:checked + label {
      border-color: var(--verde);
      background: var(--verde-light);
      color: var(--verde-dark);
    }
    .vehiculo-option label svg {
      width: 24px;
      height: 24px;
      color: var(--gris-600);
    }
    .vehiculo-option input:checked + label svg {
      color: var(--verde-dark);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    /* Secciones */
    .section-header {
      padding: 20px 20px 12px;
    }
    .section-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radio-md);
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover {
      background: var(--gris-50);
    }
    .tab-btn.active {
      background: var(--verde);
      border-color: var(--verde);
      color: var(--blanco);
    }

    /* Lista de pelotones */
    .pelotones-list {
      padding: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .peloton-item {
      background: var(--blanco);
      border-radius: var(--radio-lg);
      border: 1px solid var(--gris-200);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--sombra-sm);
    }
    .peloton-route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--gris-900);
      font-size: 0.95rem;
    }
    .peloton-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--gris-500);
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .peloton-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 8px;
      border-top: 1px solid var(--gris-100);
    }
    .btn-ver-mapa {
      padding: 8px 16px;
      border-radius: var(--radio-md);
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      color: var(--gris-700);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-ver-mapa:hover {
      border-color: var(--verde);
      color: var(--verde);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--gris-500);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      color: var(--gris-300);
    }
    .empty-state p {
      font-size: 0.875rem;
    }

    /* Estadísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 20px 16px;
    }
    .stat-card {
      background: var(--blanco);
      border-radius: var(--radio-lg);
      border: 1px solid var(--gris-200);
      padding: 16px;
      text-align: center;
      box-shadow: var(--sombra-sm);
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--verde);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--gris-500);
      font-weight: 500;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="page-header">
  <h1 class="page-title">Mi perfil</h1>
  <button class="btn-logout" onclick="cerrarSesion()" aria-label="Cerrar sesión">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </button>
</div>

<!-- Avatar y datos -->
<div class="profile-section">
  <div class="profile-header">
    <div class="avatar-large" id="avatar">--</div>
    <div class="profile-info">
      <h2 class="profile-name" id="profile-name">Cargando...</h2>
      <p class="profile-email" id="profile-email">...</p>
      <div class="badges">
        <span class="badge badge-vehiculo" id="badge-vehiculo">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
            <path d="M15 6a1 1 0 000-2h-3l-3 9H5.5"/><path d="M12 6l-3 9 6.5.5"/>
          </svg>
          <span id="vehiculo-text">--</span>
        </span>
        <span class="badge" id="badge-email">
          <span id="email-status">--</span>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Editar perfil -->
<div class="edit-section">
  <div class="edit-header">
    <span class="edit-title">Editar perfil</span>
    <button class="btn-edit" id="btn-toggle-edit" onclick="toggleEditForm()">Editar</button>
  </div>

  <form class="edit-form" id="edit-form" onsubmit="guardarCambios(event)">
    <div class="form-group">
      <label class="form-label">Nombre completo</label>
      <input type="text" class="form-input" id="edit-nombre" required>
    </div>

    <div class="form-group">
      <label class="form-label">Barrio</label>
      <input type="text" class="form-input" id="edit-barrio">
    </div>

    <div class="form-group">
      <label class="form-label">Universidad o empresa</label>
      <input type="text" class="form-input" id="edit-universidad" list="unis-list">
      <datalist id="unis-list">
        <option value="Universidad Nacional de Colombia">
        <option value="Universidad de los Andes">
        <option value="Universidad Javeriana">
        <option value="Universidad Distrital">
        <option value="Universidad del Rosario">
        <option value="Universidad EAFIT">
        <option value="Universidad de Antioquia">
        <option value="Universidad del Valle">
        <option value="Universidad Pedagógica Nacional">
        <option value="SENA">
      </datalist>
    </div>

    <div class="form-group">
      <label class="form-label">Vehículo principal</label>
      <div class="vehiculo-grid">
        <div class="vehiculo-option">
          <input type="radio" name="edit-vehiculo" id="ev-bici" value="bicicleta">
          <label for="ev-bici">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
              <path d="M15 6a1 1 0 000-2h-3l-3 9H5.5"/><path d="M12 6l-3 9 6.5.5"/>
            </svg>
            Bicicleta
          </label>
        </div>
        <div class="vehiculo-option">
          <input type="radio" name="edit-vehiculo" id="ev-patineta" value="patineta">
          <label for="ev-patineta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/>
              <path d="M3 7h2l4 8h6l2-4H9"/>
            </svg>
            Patineta
          </label>
        </div>
        <div class="vehiculo-option">
          <input type="radio" name="edit-vehiculo" id="ev-pie" value="pie">
          <label for="ev-pie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="1"/>
              <path d="M9 20l3-8 2 3 2-3 3 8M9 20h6"/>
              <path d="M12 9l-1 4"/>
            </svg>
            A pie
          </label>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" onclick="toggleEditForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </div>
  </form>
</div>

<!-- Mis Pelotones -->
<div class="section-header">
  <h3 class="section-title">Mis pelotones</h3>
  <div class="tabs">
    <button class="tab-btn active" data-tab="creados" onclick="setTab('creados')">Creados</button>
    <button class="tab-btn" data-tab="unidos" onclick="setTab('unidos')">Unidos</button>
  </div>
</div>

<div class="pelotones-list" id="pelotones-list">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
    </svg>
    <p>Cargando pelotones...</p>
  </div>
</div>

<!-- Estadísticas -->
<div class="section-header">
  <h3 class="section-title">Estadísticas</h3>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-value" id="stat-creados">0</div>
    <div class="stat-label">Pelotones creados</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-unidos">0</div>
    <div class="stat-label">Pelotones unidos</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-reportes">0</div>
    <div class="stat-label">Reportes enviados</div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>
    Mapa
  </a>
  <a href="pelotones.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
    </svg>
    Pelotones
  </a>
  <a href="reportes.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    Reportes
  </a>
  <a href="perfil.html" class="navbar-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    Perfil
  </a>
</nav>

<script type="module">
  import { auth, db } from './firebase.js';
  import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    doc, getDoc, updateDoc, onSnapshot, query, where, orderBy, limit, collection, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { showToast } from './toast.js';

  // ============================================
  // GUARD DE SESIÓN
  // ============================================
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = 'login.html';
    else cargarDatosUsuario(user);
  });

  // ============================================
  // ESTADO
  // ============================================
  let userData = null;
  let currentUser = auth.currentUser;
  let tabActual = 'creados';
  let pelotonesCreados = [];
  let pelotonesUnidos = [];

  const vehiculoIconos = {
    bicicleta: '🚲',
    patineta: '⚡',
    pie: '🚶'
  };

  // ============================================
  // CERRAR SESIÓN
  // ============================================
  window.cerrarSesion = async function() {
    try {
      await signOut(auth);
      window.location.href = 'login.html';
    } catch (error) {
      showToast('Error al cerrar sesión', 'error');
    }
  };

  // ============================================
  // CARGAR DATOS DE USUARIO
  // ============================================
  async function cargarDatosUsuario(user) {
    currentUser = user;
    
    try {
      const docSnap = await getDoc(doc(db, 'usuarios', user.uid));
      if (docSnap.exists()) {
        userData = docSnap.data();
        renderPerfil();
        cargarPelotones();
        cargarEstadisticas();
      } else {
        showToast('No se encontraron datos del usuario', 'error');
      }
    } catch (error) {
      console.error('Error al cargar usuario:', error);
      showToast('Error al cargar datos', 'error');
    }
  }

  function renderPerfil() {
    if (!userData) return;

    // Avatar con iniciales
    const iniciales = (userData.nombre || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('avatar').textContent = iniciales;

    // Nombre y correo
    document.getElementById('profile-name').textContent = userData.nombre || 'Sin nombre';
    document.getElementById('profile-email').textContent = userData.correo || currentUser?.email || '';

    // Badge de vehículo
    document.getElementById('vehiculo-text').textContent = userData.vehiculo || 'No definido';

    // Badge de email verificado
    const badgeEmail = document.getElementById('badge-email');
    const emailStatus = document.getElementById('email-status');
    if (userData.verified_email) {
      badgeEmail.className = 'badge badge-verified';
      emailStatus.textContent = '✓ Correo verificado';
    } else {
      badgeEmail.className = 'badge badge-unverified';
      emailStatus.textContent = 'Sin verificar';
    }

    // Llenar formulario de edición
    document.getElementById('edit-nombre').value = userData.nombre || '';
    document.getElementById('edit-barrio').value = userData.barrio || '';
    document.getElementById('edit-universidad').value = userData.universidad || '';
    
    const radioVehiculo = document.querySelector(`input[name="edit-vehiculo"][value="${userData.vehiculo}"]`);
    if (radioVehiculo) radioVehiculo.checked = true;
  }

  // ============================================
  // EDITAR PERFIL
  // ============================================
  window.toggleEditForm = function() {
    const form = document.getElementById('edit-form');
    const btn = document.getElementById('btn-toggle-edit');
    form.classList.toggle('open');
    btn.textContent = form.classList.contains('open') ? 'Cancelar' : 'Editar';
  };

  window.guardarCambios = async function(e) {
    e.preventDefault();

    if (!currentUser) return;

    const nombre = document.getElementById('edit-nombre').value.trim();
    const barrio = document.getElementById('edit-barrio').value.trim();
    const universidad = document.getElementById('edit-universidad').value.trim();
    const vehiculo = document.querySelector('input[name="edit-vehiculo"]:checked')?.value;

    if (!nombre) {
      showToast('El nombre es requerido', 'warning');
      return;
    }

    try {
      // Actualizar en Firestore
      await updateDoc(doc(db, 'usuarios', currentUser.uid), {
        nombre,
        barrio,
        universidad,
        vehiculo
      });

      // Actualizar displayName en Auth
      await updateProfile(currentUser, { displayName: nombre });

      // Recargar datos
      await cargarDatosUsuario(currentUser);

      showToast('Perfil actualizado', 'success');
      toggleEditForm();
    } catch (error) {
      console.error('Error al guardar:', error);
      showToast('Error al guardar cambios', 'error');
    }
  };

  // ============================================
  // TABS PELOTONES
  // ============================================
  window.setTab = function(tab) {
    tabActual = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    renderPelotones();
  };

  // ============================================
  // CARGAR PELOTONES
  // ============================================
  async function cargarPelotones() {
    if (!currentUser) return;

    try {
      // Pelotones creados (donde lider == uid)
      const qCreados = query(
        collection(db, 'pelotones'),
        where('lider', '==', currentUser.uid),
        orderBy('createdAt', 'desc'),
        limit(20)
      );
      
      const snapCreados = await getDocs(qCreados);
      pelotonesCreados = snapCreados.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      // Pelotones unidos (donde participantes array-contains uid)
      const qUnidos = query(
        collection(db, 'pelotones'),
        where('participantes', 'array-contains', currentUser.uid),
        orderBy('createdAt', 'desc'),
        limit(20)
      );
      
      const snapUnidos = await getDocs(qUnidos);
      pelotonesUnidos = snapUnidos.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(p => p.lider !== currentUser.uid); // Excluir los creados

      renderPelotones();
    } catch (error) {
      console.error('Error al cargar pelotones:', error);
    }
  }

  function renderPelotones() {
    const container = document.getElementById('pelotones-list');
    const lista = tabActual === 'creados' ? pelotonesCreados : pelotonesUnidos;

    if (lista.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
          <p>${tabActual === 'creados' ? 'No has creado pelotones' : 'No te has unido a pelotones'}</p>
        </div>
      `;
      return;
    }

    container.innerHTML = lista.map(p => {
      const vehiculoLabel = vehiculoIconos[p.vehiculo] || '🚲';
      const participantes = p.participantes || [];

      return `
        <div class="peloton-item">
          <div class="peloton-route">
            ${p.origen || 'Origen'} → ${p.destino || 'Destino'}
          </div>
          <div class="peloton-meta">
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              ${p.horaSalida || '--:--'}
            </div>
            <div class="meta-item">
              <span>${vehiculoLabel}</span>
            </div>
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
              </svg>
              ${participantes.length}/${p.cupoMax || '?'}
            </div>
          </div>
          <div class="peloton-footer">
            <a href="index.html" class="btn-ver-mapa">Ver en mapa</a>
          </div>
        </div>
      `;
    }).join('');
  }

  // ============================================
  // ESTADÍSTICAS
  // ============================================
  async function cargarEstadisticas() {
    if (!currentUser) return;

    try {
      // Contar pelotones creados
      document.getElementById('stat-creados').textContent = pelotonesCreados.length;
      
      // Contar pelotones unidos
      document.getElementById('stat-unidos').textContent = pelotonesUnidos.length;

      // Contar reportes enviados
      const qReportes = query(
        collection(db, 'reportes'),
        where('uid', '==', currentUser.uid)
      );
      const snapReportes = await getDocs(qReportes);
      document.getElementById('stat-reportes').textContent = snapReportes.size;
    } catch (error) {
      console.error('Error al cargar estadísticas:', error);
    }
  }

</script>

</body>
