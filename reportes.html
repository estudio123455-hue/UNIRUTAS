<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRutas — Reportes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--gris-50);
      padding-bottom: 80px;
    }

    /* Header */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--blanco);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gris-200);
    }
    .page-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gris-900);
    }
    .btn-reportar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 38px;
      border-radius: 20px;
      background: var(--rojo);
      color: var(--blanco);
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-reportar:hover { transform: scale(1.03); background: #b91c1c; }

    /* Filtros */
    .filtros-container {
      position: sticky;
      top: 67px;
      z-index: 30;
      background: var(--blanco);
      padding: 10px 20px;
      border-bottom: 1px solid var(--gris-200);
    }
    .filtros-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filtros-scroll::-webkit-scrollbar { display: none; }
    .filtro-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--gris-700);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .filtro-btn:hover { background: var(--gris-50); }
    .filtro-btn.active { background: var(--rojo); border-color: var(--rojo); color: var(--blanco); }

    /* Lista */
    .reportes-list {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reporte-card {
      background: var(--blanco);
      border-radius: var(--radio-lg);
      border: 1px solid var(--gris-200);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--sombra-sm);
    }
    .reporte-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reporte-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .reporte-icon.hueco     { background: #fef3c7; }
    .reporte-icon.inundacion { background: #dbeafe; }
    .reporte-icon.sospechoso { background: #ede9fe; }
    .reporte-icon.otro       { background: #fee2e2; }

    .reporte-meta-header { flex: 1; min-width: 0; }
    .tipo-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .tipo-badge.hueco     { background: #fef3c7; color: #92400e; }
    .tipo-badge.inundacion { background: #dbeafe; color: #1e40af; }
    .tipo-badge.sospechoso { background: #ede9fe; color: #7c3aed; }
    .tipo-badge.otro       { background: #fee2e2; color: #dc2626; }

    .reporte-tiempo {
      font-size: 0.78rem;
      color: var(--gris-400);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .reporte-descripcion {
      font-size: 0.9rem;
      color: var(--gris-700);
      line-height: 1.55;
      margin: 0;
    }
    .reporte-foto {
      border-radius: var(--radio-md);
      overflow: hidden;
      border: 1px solid var(--gris-100);
    }
    .reporte-foto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .reporte-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--gris-100);
    }
    .btn-votar {
      padding: 7px 14px;
      border-radius: var(--radio-md);
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .btn-votar:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-votar.util   { border-color: var(--verde); color: var(--verde); }
    .btn-votar.noUtil { border-color: var(--rojo);  color: var(--rojo); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--gris-500);
    }
    .empty-state svg { width: 56px; height: 56px; margin-bottom: 16px; color: var(--gris-300); }
    .empty-state h3 { font-size: 1.05rem; font-weight: 600; color: var(--gris-700); margin-bottom: 6px; }
    .empty-state p  { font-size: 0.875rem; }

    /* Bottom sheet */
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--blanco);
      border-radius: var(--radio-xl) var(--radio-xl) 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      padding: 16px 20px 90px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.1,0.64,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px;
      background: var(--gris-200);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .sheet-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 20px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
      margin-bottom: 6px;
    }
    .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      font-size: 0.95rem;
      background: var(--blanco);
      color: var(--gris-800);
      transition: border-color 0.15s;
      resize: none;
      min-height: 80px;
      font-family: inherit;
    }
    .form-textarea:focus { outline: none; border-color: var(--rojo); }

    /* Tipo grid */
    .tipo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .tipo-option {
      padding: 14px 10px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      background: var(--blanco);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .tipo-option:hover { background: var(--gris-50); }
    .tipo-option.selected { border-color: var(--rojo); background: rgba(220,38,38,0.06); }
    .tipo-option-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .tipo-option-icon.hueco     { background: #fef3c7; }
    .tipo-option-icon.inundacion { background: #dbeafe; }
    .tipo-option-icon.sospechoso { background: #ede9fe; }
    .tipo-option-icon.otro       { background: #fee2e2; }
    .tipo-option span { font-size: 0.875rem; font-weight: 500; color: var(--gris-700); }

    /* Char counter */
    .char-counter { text-align: right; font-size: 0.75rem; color: var(--gris-400); margin-top: 4px; }
    .char-counter.near-limit { color: #f59e0b; }
    .char-counter.at-limit   { color: var(--rojo); font-weight: 600; }

    /* Foto upload */
    .foto-upload-zone {
      position: relative;
      border: 1.5px dashed var(--gris-300);
      border-radius: var(--radio-md);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .foto-upload-zone:hover { border-color: var(--rojo); background: rgba(220,38,38,0.04); }
    .foto-upload-zone input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .foto-upload-text {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: var(--gris-500); font-size: 0.875rem;
      pointer-events: none;
    }
    .foto-upload-text svg { color: var(--gris-400); }
    .foto-preview {
      position: relative;
      border-radius: var(--radio-md); overflow: hidden;
      border: 1px solid var(--gris-200);
    }
    .foto-preview img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .foto-preview-remove {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px;
    }

    /* Mini mapa */
    .mini-mapa-container {
      position: relative;
      height: 200px;
      border-radius: var(--radio-lg); overflow: hidden;
      border: 1px solid var(--gris-200);
    }
    #mini-mapa { width: 100%; height: 100%; }
    .btn-ubicacion {
      position: absolute; bottom: 10px; right: 10px; z-index: 999;
      width: 40px; height: 40px; border-radius: 50%;
      background: #ffffff; border: 1.5px solid #d1d5db;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #374151;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ubicacion:hover { background: #f9fafb; color: #16a34a; }

    /* Overlay */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 90; display: none; }
    .overlay.visible { display: block; }
  </style>
</head>
<body>
<div id="auth-guard" class="auth-guard"><div class="auth-guard-spinner"></div></div>

<!-- Header -->
<div class="page-header">
  <h1 class="page-title">Reportes de peligro</h1>
  <button class="btn-reportar" onclick="abrirSheet()" aria-label="Crear reporte">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Reportar
  </button>
</div>

<!-- Filtros -->
<div class="filtros-container">
  <div class="filtros-scroll">
    <button class="filtro-btn active" data-filtro="todos"      onclick="setFiltro('todos')">Todos</button>
    <button class="filtro-btn"        data-filtro="hueco"      onclick="setFiltro('hueco')">🕳️ Hueco</button>
    <button class="filtro-btn"        data-filtro="inundacion" onclick="setFiltro('inundacion')">🌊 Inundación</button>
    <button class="filtro-btn"        data-filtro="sospechoso" onclick="setFiltro('sospechoso')">👤 Sospechoso</button>
    <button class="filtro-btn"        data-filtro="otro"       onclick="setFiltro('otro')">⚠️ Otro</button>
  </div>
</div>

<!-- Lista de reportes -->
<div class="reportes-list" id="reportes-list">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h3>Cargando reportes...</h3>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="cerrarSheet()"></div>

<!-- Bottom sheet: formulario -->
<div class="bottom-sheet" id="bottom-sheet">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title">Reportar peligro</h2>

  <form id="form-reporte" onsubmit="crearReporte(event)">

    <!-- Tipo -->
    <div class="form-group">
      <label class="form-label">Tipo de peligro</label>
      <div class="tipo-grid">
        <div class="tipo-option selected" data-tipo="hueco" onclick="selectTipo('hueco')">
          <div class="tipo-option-icon hueco">🕳️</div>
          <span>Hueco</span>
        </div>
        <div class="tipo-option" data-tipo="inundacion" onclick="selectTipo('inundacion')">
          <div class="tipo-option-icon inundacion">🌊</div>
          <span>Inundación</span>
        </div>
        <div class="tipo-option" data-tipo="sospechoso" onclick="selectTipo('sospechoso')">
          <div class="tipo-option-icon sospechoso">👤</div>
          <span>Sospechoso</span>
        </div>
        <div class="tipo-option" data-tipo="otro" onclick="selectTipo('otro')">
          <div class="tipo-option-icon otro">⚠️</div>
          <span>Otro</span>
        </div>
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label class="form-label">Descripción <span style="font-weight:400;color:var(--gris-500)">(opcional)</span></label>
      <textarea class="form-textarea" id="input-descripcion" maxlength="300" rows="3" placeholder="Describe el peligro..."></textarea>
      <div class="char-counter" id="char-counter">0 / 300</div>
    </div>

    <!-- Foto -->
    <div class="form-group">
      <label class="form-label">Foto <span style="font-weight:400;color:var(--gris-500)">(opcional, máx 5 MB)</span></label>
      <div id="foto-upload-zone" class="foto-upload-zone">
        <input type="file" id="input-foto" accept="image/*" onchange="seleccionarFoto(event)">
        <div class="foto-upload-text">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Toca para adjuntar foto</span>
        </div>
      </div>
      <div id="foto-preview-container" style="display:none" class="foto-preview">
        <img id="foto-preview-img" src="" alt="Vista previa">
        <button type="button" class="foto-preview-remove" onclick="quitarFoto()" aria-label="Quitar foto">✕</button>
      </div>
    </div>

    <!-- Ubicación -->
    <div class="form-group">
      <label class="form-label">Ubicación exacta</label>
      <div class="mini-mapa-container">
        <div id="mini-mapa"></div>
        <button type="button" class="btn-ubicacion" onclick="usarMiUbicacion()" aria-label="Usar mi ubicación">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%; background:var(--rojo); border-color:var(--rojo)">Reportar</button>
  </form>
</div>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>
    Mapa
  </a>
  <a href="pelotones.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
    </svg>
    Pelotones
  </a>
  <a href="reportes.html" class="navbar-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    Reportes
  </a>
  <a href="perfil.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    Perfil
  </a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { auth, db, storage } from './firebase.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, onSnapshot, query, orderBy, limit,
    addDoc, serverTimestamp, where, Timestamp, doc, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { showToast } from './toast.js';

  // ---- Auth guard ----
  function ocultarGuard() {
    const g = document.getElementById('auth-guard');
    if (!g) return;
    g.classList.add('done');
    setTimeout(() => g.remove(), 260);
  }
  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    ocultarGuard();
  });

  // ---- Estado ----
  let filtroActual = 'todos';
  let reportesData = [];
  let currentUser  = auth.currentUser;
  auth.onAuthStateChanged(u => { currentUser = u; });

  let tipoSeleccionado = 'hueco';
  let pendingFoto      = null;
  let reporteCoords    = { lat: 4.7110, lng: -74.0721 };
  let miniMapa         = null;
  let markerReporte    = null;

  const infoTipos = {
    hueco:      { color: '#92400e', emoji: '🕳️', label: 'Hueco' },
    inundacion: { color: '#1e40af', emoji: '🌊', label: 'Inundación' },
    sospechoso: { color: '#7c3aed', emoji: '👤', label: 'Sospechoso' },
    otro:       { color: '#dc2626', emoji: '⚠️', label: 'Peligro' }
  };

  // ---- Filtros ----
  window.setFiltro = function(filtro) {
    filtroActual = filtro;
    document.querySelectorAll('.filtro-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filtro === filtro);
    });
    renderReportes();
  };

  // ---- Cargar reportes en tiempo real ----
  const HORAS_VIDA = 24;
  const limite = Timestamp.fromMillis(Date.now() - HORAS_VIDA * 3600000);

  onSnapshot(
    query(collection(db, 'reportes'), where('createdAt', '>', limite), orderBy('createdAt', 'desc'), limit(50)),
    snap => {
      reportesData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderReportes();
    }
  );

  function renderReportes() {
    const container = document.getElementById('reportes-list');
    const filtrados = filtroActual === 'todos' ? reportesData : reportesData.filter(r => r.tipo === filtroActual);
    const activos   = filtrados.filter(r => !r.resuelto);

    if (activos.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <h3>No hay reportes</h3>
          <p>${filtroActual === 'todos' ? 'Sé el primero en reportar un peligro' : 'No hay reportes de este tipo'}</p>
        </div>`;
      return;
    }

    container.innerHTML = activos.map(r => {
      const info   = infoTipos[r.tipo] || infoTipos.otro;
      const tiempo = formatearTiempo(r.createdAt);
      const yoVote = r.votos?.[currentUser?.uid];
      const score  = r.score || 0;

      return `
        <div class="reporte-card">
          <div class="reporte-header">
            <div class="reporte-icon ${r.tipo}">${info.emoji}</div>
            <div class="reporte-meta-header">
              <span class="tipo-badge ${r.tipo}">${info.label}</span>
              <span style="margin-left:6px; font-size:0.78rem; color:var(--gris-500); font-weight:600">${score > 0 ? '+' : ''}${score}</span>
            </div>
            <span class="reporte-tiempo">${tiempo}</span>
          </div>

          ${r.descripcion ? `<p class="reporte-descripcion">${r.descripcion}</p>` : ''}

          ${r.fotoURL ? `<div class="reporte-foto"><img src="${r.fotoURL}" alt="Foto del reporte" loading="lazy"></div>` : ''}

          <div class="reporte-footer">
            <button class="btn-votar util"   onclick="votarReporte('${r.id}', true)"  ${yoVote === true  ? 'disabled' : ''}>👍 Útil</button>
            <button class="btn-votar noUtil" onclick="votarReporte('${r.id}', false)" ${yoVote === false ? 'disabled' : ''}>👎 Falso</button>
          </div>
        </div>`;
    }).join('');
  }

  function formatearTiempo(ts) {
    if (!ts) return 'Reciente';
    const fecha  = ts.toDate ? ts.toDate() : new Date(ts);
    const diffMin = Math.floor((Date.now() - fecha) / 60000);
    if (diffMin < 1)  return 'Ahora mismo';
    if (diffMin < 60) return `hace ${diffMin} min`;
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24)   return `hace ${diffH} h`;
    return `hace ${Math.floor(diffH / 24)} d`;
  }

  // ---- Bottom sheet ----
  window.abrirSheet = function() {
    document.getElementById('bottom-sheet').classList.add('open');
    document.getElementById('overlay').classList.add('visible');
    initMiniMapa();
  };

  window.cerrarSheet = function() {
    document.getElementById('bottom-sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
    limpiarFormulario();
  };

  function limpiarFormulario() {
    document.getElementById('form-reporte').reset();
    reporteCoords = { lat: 4.7110, lng: -74.0721 };
    selectTipo('hueco');
    quitarFoto();
    const counter = document.getElementById('char-counter');
    counter.textContent = '0 / 300';
    counter.className   = 'char-counter';
    if (markerReporte && miniMapa) { miniMapa.removeLayer(markerReporte); markerReporte = null; }
  }

  // ---- Tipo ----
  window.selectTipo = function(tipo) {
    tipoSeleccionado = tipo;
    document.querySelectorAll('.tipo-option').forEach(opt => {
      opt.classList.toggle('selected', opt.dataset.tipo === tipo);
    });
  };

  // ---- Mini mapa ----
  function initMiniMapa() {
    if (miniMapa) return;
    miniMapa = L.map('mini-mapa', { zoomControl: false }).setView([reporteCoords.lat, reporteCoords.lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: false }).addTo(miniMapa);
    actualizarMarkerReporte();
  }

  function actualizarMarkerReporte() {
    if (markerReporte) miniMapa.removeLayer(markerReporte);
    const info = infoTipos[tipoSeleccionado] || infoTipos.otro;
    markerReporte = L.marker([reporteCoords.lat, reporteCoords.lng], {
      draggable: true,
      icon: L.divIcon({
        html: `<div style="width:32px;height:32px;background:${info.color};border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:14px">${info.emoji}</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16], className: ''
      })
    }).addTo(miniMapa);
    markerReporte.on('dragend', e => {
      const p = e.target.getLatLng();
      reporteCoords = { lat: p.lat, lng: p.lng };
    });
  }

  const observer = new MutationObserver(() => {
    if (miniMapa && markerReporte) actualizarMarkerReporte();
  });
  observer.observe(document.querySelector('.tipo-grid'), { subtree: true, attributes: true });

  // ---- Mi ubicación ----
  window.usarMiUbicacion = function() {
    if (!navigator.geolocation) { showToast('Tu navegador no soporta geolocalización', 'warning'); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        reporteCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        miniMapa.setView([reporteCoords.lat, reporteCoords.lng], 16);
        actualizarMarkerReporte();
        showToast('Ubicación actualizada', 'success');
      },
      () => showToast('No se pudo obtener tu ubicación', 'warning')
    );
  };

  // ---- Contador descripción ----
  document.getElementById('input-descripcion').addEventListener('input', function() {
    const len     = this.value.length;
    const counter = document.getElementById('char-counter');
    counter.textContent = `${len} / 300`;
    counter.className   = 'char-counter' + (len >= 300 ? ' at-limit' : len >= 270 ? ' near-limit' : '');
  });

  // ---- Foto ----
  window.seleccionarFoto = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('Solo se permiten imágenes', 'warning'); e.target.value = ''; return; }
    if (file.size > 5 * 1024 * 1024)    { showToast('La imagen no puede superar 5 MB', 'warning'); e.target.value = ''; return; }
    pendingFoto = file;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('foto-preview-img').src = ev.target.result;
      document.getElementById('foto-preview-container').style.display = 'block';
      document.getElementById('foto-upload-zone').style.display        = 'none';
    };
    reader.readAsDataURL(file);
  };

  window.quitarFoto = function() {
    pendingFoto = null;
    const input   = document.getElementById('input-foto');
    const preview = document.getElementById('foto-preview-container');
    const zone    = document.getElementById('foto-upload-zone');
    if (input)   input.value             = '';
    if (preview) preview.style.display   = 'none';
    if (zone)    zone.style.display      = 'block';
  };

  // ---- Crear reporte ----
  window.crearReporte = async function(e) {
    e.preventDefault();
    if (!currentUser) { showToast('Debes iniciar sesión', 'error'); return; }

    const btn = document.querySelector('#form-reporte [type="submit"]');
    const textoOriginal = btn.textContent;
    btn.disabled    = true;
    btn.textContent = 'Enviando…';

    const descripcion = document.getElementById('input-descripcion').value.trim().slice(0, 300);

    try {
      let fotoURL = '';
      if (pendingFoto) {
        const ext  = pendingFoto.name.includes('.') ? pendingFoto.name.split('.').pop() : 'jpg';
        const fRef = storageRef(storage, `reportes/${currentUser.uid}/${Date.now()}.${ext}`);
        await uploadBytes(fRef, pendingFoto);
        fotoURL = await getDownloadURL(fRef);
      }

      await addDoc(collection(db, 'reportes'), {
        tipo: tipoSeleccionado,
        descripcion,
        fotoURL,
        lat: reporteCoords.lat,
        lng: reporteCoords.lng,
        uid: currentUser.uid,
        createdAt: serverTimestamp(),
        votos: {},
        score: 0,
        resuelto: false
      });

      showToast('¡Reporte enviado!', 'success');
      cerrarSheet();
    } catch (err) {
      console.error('Error al crear reporte:', err);
      showToast('Error al enviar el reporte', 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = textoOriginal;
    }
  };

  // ---- Votar ----
  window.votarReporte = async function(reporteId, util) {
    if (!currentUser) { showToast('Debes iniciar sesión', 'error'); return; }
    const uid = currentUser.uid;
    const ref = doc(db, 'reportes', reporteId);
    try {
      await runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const data   = snap.data();
        const votos  = { ...data.votos, [uid]: util };
        const vals   = Object.values(votos);
        const utiles = vals.filter(v => v === true).length;
        const noUtil = vals.filter(v => v === false).length;
        tx.update(ref, { votos, score: utiles - noUtil, resuelto: noUtil >= 3 && noUtil > utiles });
      });
      showToast('Voto registrado', 'success');
    } catch (err) {
      console.error('Error al votar:', err);
      showToast('Error al votar', 'error');
    }
  };
</script>

</body>
</html>
