<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRutas — Reportes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--gris-50);
      padding-bottom: 80px;
    }

    /* Header */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--blanco);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gris-200);
    }
    .page-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gris-900);
    }
    .btn-add {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--rojo);
      color: var(--blanco);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-add:hover {
      transform: scale(1.05);
      background: #b91c1c;
    }

    /* Mapa principal */
    .mapa-container {
      position: relative;
      height: 280px;
      border-bottom: 1px solid var(--gris-200);
    }
    #mapa {
      width: 100%;
      height: 100%;
    }

    /* Filtros */
    .filtros-container {
      position: sticky;
      top: 73px;
      z-index: 30;
      background: var(--blanco);
      padding: 12px 20px;
      border-bottom: 1px solid var(--gris-200);
    }
    .filtros-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filtros-scroll::-webkit-scrollbar {
      display: none;
    }
    .filtro-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filtro-btn:hover {
      background: var(--gris-50);
    }
    .filtro-btn.active {
      background: var(--rojo);
      border-color: var(--rojo);
      color: var(--blanco);
    }

    /* Lista de reportes */
    .reportes-list {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reporte-card {
      background: var(--blanco);
      border-radius: var(--radio-lg);
      border: 1px solid var(--gris-200);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--sombra-sm);
    }
    .reporte-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reporte-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .reporte-icon.hueco { background: #fef3c7; }
    .reporte-icon.inundacion { background: #dbeafe; }
    .reporte-icon.sospechoso { background: #ede9fe; }
    .reporte-icon.otro { background: #fee2e2; }

    .reporte-info {
      flex: 1;
    }
    .tipo-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .tipo-badge.hueco { background: #fef3c7; color: #92400e; }
    .tipo-badge.inundacion { background: #dbeafe; color: #1e40af; }
    .tipo-badge.sospechoso { background: #ede9fe; color: #7c3aed; }
    .tipo-badge.otro { background: #fee2e2; color: #dc2626; }

    .reporte-descripcion {
      font-size: 0.95rem;
      color: var(--gris-700);
      line-height: 1.5;
    }

    .reporte-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--gris-500);
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reporte-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 8px;
      border-top: 1px solid var(--gris-100);
    }
    .btn-ver-mapa {
      padding: 8px 16px;
      border-radius: var(--radio-md);
      border: 1.5px solid var(--gris-200);
      background: var(--blanco);
      color: var(--gris-700);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ver-mapa:hover {
      border-color: var(--verde);
      color: var(--verde);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--gris-500);
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      color: var(--gris-300);
    }
    .empty-state h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--gris-700);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 0.875rem;
    }

    /* Bottom sheet */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--blanco);
      border-radius: var(--radio-xl) var(--radio-xl) 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      padding: 16px 20px 32px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.1,0.64,1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--gris-200);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .sheet-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 20px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
      margin-bottom: 6px;
    }
    .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      font-size: 0.95rem;
      background: var(--blanco);
      color: var(--gris-800);
      transition: border-color 0.15s;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    .form-textarea:focus {
      outline: none;
      border-color: var(--rojo);
    }

    /* Tipo selector grid */
    .tipo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .tipo-option {
      padding: 16px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio-md);
      background: var(--blanco);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .tipo-option:hover {
      background: var(--gris-50);
    }
    .tipo-option.selected {
      border-color: var(--rojo);
      background: var(--rojo-light);
    }
    .tipo-option-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .tipo-option-icon.hueco { background: #fef3c7; }
    .tipo-option-icon.inundacion { background: #dbeafe; }
    .tipo-option-icon.sospechoso { background: #ede9fe; }
    .tipo-option-icon.otro { background: #fee2e2; }
    .tipo-option span {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gris-700);
    }

    /* Mini mapa */
    .mini-mapa-container {
      position: relative;
      height: 250px;
      border-radius: var(--radio-lg);
      overflow: hidden;
      border: 1px solid var(--gris-200);
      margin-bottom: 12px;
    }
    #mini-mapa {
      width: 100%;
      height: 100%;
    }
    .btn-ubicacion {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blanco);
      border: 1px solid var(--gris-200);
      box-shadow: var(--sombra-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--gris-600);
      transition: background 0.15s;
    }
    .btn-ubicacion:hover {
      background: var(--gris-50);
      color: var(--verde);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 90;
      display: none;
    }
    .overlay.visible {
      display: block;
    }

    /* Leaflet overrides */
    .leaflet-control-zoom {
      border-radius: var(--radio-md) !important;
      border: 1px solid var(--gris-200) !important;
      box-shadow: var(--sombra-sm) !important;
    }
    .leaflet-control-zoom a {
      border-radius: 0 !important;
      color: var(--gris-600) !important;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="page-header">
  <h1 class="page-title">Reportes de peligro</h1>
  <button class="btn-add" onclick="abrirSheet()" aria-label="Crear reporte">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<!-- Mapa principal -->
<div class="mapa-container">
  <div id="mapa"></div>
</div>

<!-- Filtros -->
<div class="filtros-container">
  <div class="filtros-scroll">
    <button class="filtro-btn active" data-filtro="todos" onclick="setFiltro('todos')">Todos</button>
    <button class="filtro-btn" data-filtro="hueco" onclick="setFiltro('hueco')">🕳️ Hueco</button>
    <button class="filtro-btn" data-filtro="inundacion" onclick="setFiltro('inundacion')">🌊 Inundación</button>
    <button class="filtro-btn" data-filtro="sospechoso" onclick="setFiltro('sospechoso')">👤 Sospechoso</button>
    <button class="filtro-btn" data-filtro="otro" onclick="setFiltro('otro')">⚠️ Otro</button>
  </div>
</div>

<!-- Lista de reportes -->
<div class="reportes-list" id="reportes-list">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h3>Cargando reportes...</h3>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="cerrarSheet()"></div>

<!-- Bottom sheet: crear reporte -->
<div class="bottom-sheet" id="bottom-sheet">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title">Reportar peligro</h2>

  <form id="form-reporte" onsubmit="crearReporte(event)">
    <!-- Tipo de peligro -->
    <div class="form-group">
      <label class="form-label">Tipo de peligro</label>
      <div class="tipo-grid">
        <div class="tipo-option selected" data-tipo="hueco" onclick="selectTipo('hueco')">
          <div class="tipo-option-icon hueco">🕳️</div>
          <span>Hueco</span>
        </div>
        <div class="tipo-option" data-tipo="inundacion" onclick="selectTipo('inundacion')">
          <div class="tipo-option-icon inundacion">🌊</div>
          <span>Inundación</span>
        </div>
        <div class="tipo-option" data-tipo="sospechoso" onclick="selectTipo('sospechoso')">
          <div class="tipo-option-icon sospechoso">👤</div>
          <span>Sospechoso</span>
        </div>
        <div class="tipo-option" data-tipo="otro" onclick="selectTipo('otro')">
          <div class="tipo-option-icon otro">⚠️</div>
          <span>Otro</span>
        </div>
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label class="form-label">Descripción (opcional)</label>
      <textarea class="form-textarea" id="input-descripcion" placeholder="Describe el peligro..."></textarea>
    </div>

    <!-- Mini mapa -->
    <div class="form-group">
      <label class="form-label">Ubicación exacta</label>
      <div class="mini-mapa-container">
        <div id="mini-mapa"></div>
        <button class="btn-ubicacion" onclick="usarMiUbicacion()" aria-label="Usar mi ubicación">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Botón reportar -->
    <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--rojo); border-color: var(--rojo)">Reportar</button>
  </form>
</div>

<!-- Navbar -->
<nav class="navbar">

      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>

    Reportes

  <a href="perfil.html" class="navbar-item">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { auth, db } from './firebase.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, onSnapshot, query, orderBy, limit, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { showToast } from './toast.js';

  // ============================================
  // GUARD DE SESIÓN
  // ============================================
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = 'login.html';
  });

  // ============================================
  // ESTADO
  // ============================================
  let filtroActual = 'todos';
  let reportesData = [];
  let currentUser = auth.currentUser;
  auth.onAuthStateChanged((user) => { currentUser = user; });

  let tipoSeleccionado = 'hueco';
  let reporteCoords = { lat: 4.7110, lng: -74.0721 };
  let mapa = null;
  let miniMapa = null;
  let markerReporte = null;
  let marcadoresMapa = {};

  const infoTipos = {
    hueco: { color: '#92400e', emoji: '🕳️', label: 'Hueco' },
    inundacion: { color: '#1e40af', emoji: '🌊', label: 'Inundación' },
    sospechoso: { color: '#7c3aed', emoji: '👤', label: 'Sospechoso' },
    otro: { color: '#dc2626', emoji: '⚠️', label: 'Peligro' }
  };

  // ============================================
  // MAPA PRINCIPAL
  // ============================================
  function initMapa() {
    if (mapa) return;

    mapa = L.map('mapa', { zoomControl: true }).setView([4.7110, -74.0721], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: false
    }).addTo(mapa);
  }

  function actualizarMarcadoresMapa() {
    // Limpiar marcadores viejos
    Object.values(marcadoresMapa).forEach(m => mapa.removeLayer(m));
    marcadoresMapa = {};

    const filtrados = filtroActual === 'todos' 
      ? reportesData 
      : reportesData.filter(r => r.tipo === filtroActual);

    filtrados.forEach(r => {
      if (!r.lat || !r.lng) return;
      const info = infoTipos[r.tipo] || infoTipos.otro;

      const icono = L.divIcon({
        html: `<div style="width:32px;height:32px;background:${info.color};border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:14px">${info.emoji}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        className: ''
      });

      const marker = L.marker([r.lat, r.lng], { icon: icono })
        .bindPopup(`
          <div style="font-family:Inter,sans-serif; padding:4px">
            <strong style="color:${info.color}">${info.label}</strong><br>
            <span style="font-size:12px; color:#6b7280">${r.descripcion || 'Sin descripción'}</span>
          </div>
        `)
        .addTo(mapa);
      
      marcadoresMapa[r.id] = marker;
    });
  }

  // ============================================
  // FILTROS
  // ============================================
  window.setFiltro = function(filtro) {
    filtroActual = filtro;
    document.querySelectorAll('.filtro-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filtro === filtro);
    });
    actualizarMarcadoresMapa();
    renderReportes();
  };

  // ============================================
  // CARGAR REPORTES EN TIEMPO REAL
  // ============================================
  const qReportes = query(collection(db, 'reportes'), orderBy('createdAt', 'desc'), limit(50));
  onSnapshot(qReportes, (snap) => {
    reportesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    initMapa();
    actualizarMarcadoresMapa();
    renderReportes();
  });

  function renderReportes() {
    const container = document.getElementById('reportes-list');
    const filtrados = filtroActual === 'todos' 
      ? reportesData 
      : reportesData.filter(r => r.tipo === filtroActual);

    if (filtrados.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <h3>No hay reportes</h3>
          <p>${filtroActual === 'todos' ? 'Sé el primero en reportar' : 'No hay reportes de este tipo'}</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filtrados.map(r => {
      const info = infoTipos[r.tipo] || infoTipos.otro;
      const tiempo = formatearTiempo(r.createdAt);

      return `
        <div class="reporte-card">
          <div class="reporte-header">
            <div class="reporte-icon ${r.tipo}">${info.emoji}</div>
            <div class="reporte-info">
              <span class="tipo-badge ${r.tipo}">${info.label}</span>
            </div>
          </div>

          <div class="reporte-descripcion">${r.descripcion || 'Sin descripción'}</div>

          <div class="reporte-meta">
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              ${tiempo}
            </div>
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              ${r.lat?.toFixed(4)}, ${r.lng?.toFixed(4)}
            </div>
          </div>

          <div class="reporte-footer">
            <button class="btn-ver-mapa" onclick="verEnMapa('${r.id}', ${r.lat}, ${r.lng})">Ver en mapa</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function formatearTiempo(createdAt) {
    if (!createdAt) return 'Reciente';
    const ahora = new Date();
    const fecha = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
    const diffMs = ahora - fecha;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHoras = Math.floor(diffMs / 3600000);
    const diffDias = Math.floor(diffMs / 86400000);

    if (diffMin < 1) return 'Ahora mismo';
    if (diffMin < 60) return `hace ${diffMin} min`;
    if (diffHoras < 24) return `hace ${diffHoras} h`;
    if (diffDias < 7) return `hace ${diffDias} d`;
    return fecha.toLocaleDateString('es-CO');
  }

  // ============================================
  // VER EN MAPA
  // ============================================
  window.verEnMapa = function(id, lat, lng) {
    mapa.setView([lat, lng], 17);
    const marker = marcadoresMapa[id];
    if (marker) marker.openPopup();
    
    // Scroll al mapa
    document.querySelector('.mapa-container').scrollIntoView({ behavior: 'smooth' });
  };

  // ============================================
  // BOTTOM SHEET
  // ============================================
  window.abrirSheet = function() {
    document.getElementById('bottom-sheet').classList.add('open');
    document.getElementById('overlay').classList.add('visible');
    initMiniMapa();
  };

  window.cerrarSheet = function() {
    document.getElementById('bottom-sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
    limpiarFormulario();
  };

  function limpiarFormulario() {
    document.getElementById('form-reporte').reset();
    reporteCoords = { lat: 4.7110, lng: -74.0721 };
    selectTipo('hueco');
    if (markerReporte) {
      miniMapa.removeLayer(markerReporte);
      markerReporte = null;
    }
  }

  // ============================================
  // SELECTOR DE TIPO
  // ============================================
  window.selectTipo = function(tipo) {
    tipoSeleccionado = tipo;
    document.querySelectorAll('.tipo-option').forEach(opt => {
      opt.classList.toggle('selected', opt.dataset.tipo === tipo);
    });
  };

  // ============================================
  // MINI MAPA
  // ============================================
  function initMiniMapa() {
    if (miniMapa) return;

    miniMapa = L.map('mini-mapa', { zoomControl: false }).setView([reporteCoords.lat, reporteCoords.lng], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: false
    }).addTo(miniMapa);

    // Marcador arrastrable
    actualizarMarkerReporte();
  }

  function actualizarMarkerReporte() {
    if (markerReporte) miniMapa.removeLayer(markerReporte);

    const info = infoTipos[tipoSeleccionado] || infoTipos.otro;

    markerReporte = L.marker([reporteCoords.lat, reporteCoords.lng], {
      draggable: true,
      icon: L.divIcon({
        html: `<div style="width:32px;height:32px;background:${info.color};border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:14px">${info.emoji}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        className: ''
      })
    }).addTo(miniMapa);

    markerReporte.on('dragend', function(e) {
      const pos = e.target.getLatLng();
      reporteCoords = { lat: pos.lat, lng: pos.lng };
    });
  }

  // Actualizar marcador cuando cambia el tipo
  const observer = new MutationObserver(() => {
    if (miniMapa && markerReporte) {
      actualizarMarkerReporte();
    }
  });
  observer.observe(document.querySelector('.tipo-grid'), { subtree: true, attributes: true });

  // ============================================
  // USAR MI UBICACIÓN
  // ============================================
  window.usarMiUbicacion = function() {
    if (!navigator.geolocation) {
      showToast('Tu navegador no soporta geolocalización', 'warning');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        reporteCoords = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };
        miniMapa.setView([reporteCoords.lat, reporteCoords.lng], 16);
        actualizarMarkerReporte();
        showToast('Ubicación actualizada', 'success');
      },
      () => showToast('No se pudo obtener tu ubicación', 'warning')
    );
  };

  // ============================================
  // CREAR REPORTE
  // ============================================
  window.crearReporte = async function(e) {
    e.preventDefault();

    if (!currentUser) {
      showToast('Debes iniciar sesión', 'error');
      return;
    }

    const descripcion = document.getElementById('input-descripcion').value.trim();

    try {
      await addDoc(collection(db, 'reportes'), {
        tipo: tipoSeleccionado,
        descripcion,
        lat: reporteCoords.lat,
        lng: reporteCoords.lng,
        uid: currentUser.uid,
        createdAt: serverTimestamp()
      });

      showToast('¡Reporte enviado exitosamente!', 'success');
      cerrarSheet();
    } catch (error) {
      console.error('Error al crear reporte:', error);
      showToast('Error al enviar reporte', 'error');
    }
  };

</script>

</body>
</html>
