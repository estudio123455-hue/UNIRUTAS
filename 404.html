<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRutas — Página no encontrada</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--gris-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 68px;
    }

    /* Header */
    .page-header {
      background: var(--blanco);
      padding: 16px 20px;
      border-bottom: 1px solid var(--gris-200);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--verde);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gris-900);
    }

    /* Contenido principal */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* Ilustración bici */
    .illustration {
      width: 120px;
      height: 120px;
      background: var(--verde-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    .illustration svg {
      color: var(--verde);
    }

    /* Código 404 */
    .code-404 {
      font-size: 5rem;
      font-weight: 800;
      color: var(--gris-200);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--gris-500);
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 32px;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      height: 48px;
      background: var(--verde);
      color: var(--blanco);
      border: none;
      border-radius: 24px;
      font-size: 0.975rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-volver:hover {
      transform: translateY(-1px);
      background: #0d7a5f;
    }

    .link-secundario {
      margin-top: 16px;
      font-size: 0.875rem;
      color: var(--gris-400);
    }
    .link-secundario a {
      color: var(--verde);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="page-header">
  <div class="logo-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4l3 3"/>
    </svg>
  </div>
  <span class="logo-text">UniRutas</span>
</header>

<!-- Contenido -->
<main class="content">
  <div class="illustration">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5.5" cy="17.5" r="3.5"/>
      <circle cx="18.5" cy="17.5" r="3.5"/>
      <path d="M15 6a1 1 0 000-2h-3l-3 9H5.5"/>
      <path d="M12 6l-3 9 6.5.5"/>
    </svg>
  </div>

  <div class="code-404">404</div>

  <h1 class="title">Esta ruta no existe</h1>
  <p class="subtitle">…pero las nuestras sí 🚴<br>La página que buscas no fue encontrada o fue movida.</p>

  <a href="index.html" class="btn-volver">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>
    Volver al mapa
  </a>

  <p class="link-secundario">
    ¿Buscas algo más? <a href="reportes.html">Ver reportes</a> · <a href="pelotones.html">Ver pelotones</a>
  </p>
</main>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>
    Mapa
  </a>
  <a href="pelotones.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
    </svg>
    Pelotones
  </a>
  <a href="reportes.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    Reportes
  </a>
  <a href="perfil.html" class="navbar-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    Perfil
  </a>
</nav>

</body>
</html>
